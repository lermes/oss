<?xml version="1.0" standalone="no"?>
<svg id="logo-only" viewBox="0 0 200 200" class="w-48 h-48 mb-8" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024"><defs><linearGradient id="sapphireSilver" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#0F52BA"/><stop offset="50%" stop-color="#4A90E2"/><stop offset="100%" stop-color="#C0C0C0"/></linearGradient><linearGradient id="highlightGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="white" stop-opacity="0"/><stop offset="50%" stop-color="white" stop-opacity="1"/><stop offset="100%" stop-color="white" stop-opacity="0"/></linearGradient><filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2" result="blur"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%" filterUnits="userSpaceOnUse"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.25"/></filter><style>
          /* Logo animation classes */
          @keyframes infinite-track {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -334; }
          }
          
          .streak {
            stroke-dasharray: 27 307;
            animation: infinite-track 1.8s linear infinite;
            mix-blend-mode: screen;
          }
          
          .symbol-draw {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: draw-symbol 2.5s ease-out forwards;
          }
          
          @keyframes draw-symbol {
            to { stroke-dashoffset: 0; }
          }
        </style></defs><g filter="url(#dropShadow)" transform="translate(0, 40)"><g><path class="symbol-draw" d="M50,60 C50,30 80,30 100,60 C120,90 150,90 150,60 C150,30 120,30 100,60 C80,90 50,90 50,60 Z" fill="none" stroke="url(#sapphireSilver)" stroke-width="11" stroke-linecap="round"/></g></g></svg>